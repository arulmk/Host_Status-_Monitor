name: Status Check

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — adjust as needed
  workflow_dispatch: {}       # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run status checks
        run: python check_status.py

      - name: Commit updated history
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status-history.json
          git diff --cached --quiet || git commit -m "Update status history"
          git push
